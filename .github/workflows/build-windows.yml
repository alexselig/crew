# Builds the Windows installer + portable zip on a real Windows runner, because
# node-pty is a native module that must be compiled on Windows (it can't be
# cross-compiled from the maintainer's Mac). The build is unsigned for now, so
# Windows SmartScreen will warn until the download earns reputation.
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to (e.g. v0.3.0). Blank = artifact only."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install test prerequisites
        shell: pwsh
        run: |
          choco install sqlite --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "SQLite test dependency installation failed." }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Chromium test dependency installation failed." }

      - name: Typecheck and test
        run: npm run typecheck; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm test

      - name: Rebuild native modules (node-pty) for Electron
        run: npm run rebuild:native

      - name: Build + package Windows installer & portable zip
        run: npm run dist:win

      - name: Verify packaged native PTY
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          $script = Join-Path $PWD 'scripts/smoke-packaged-pty.cjs'
          $archive = Join-Path $PWD 'dist/win-unpacked/resources/app.asar'
          $process = Start-Process 'dist/win-unpacked/Crew.exe' -ArgumentList "`"$script`"", "`"$archive`"" -Wait -NoNewWindow -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged PTY smoke check failed: $($process.ExitCode)" }

      - name: Stage a stable-named installer alias
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "dist/Crew-Setup-$version.exe" 'dist/Crew-Setup.exe' -ErrorAction Stop

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crew-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Attach build to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $env:RELEASE_TAG
          }
          $repo = '${{ github.repository }}'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne "v$version") { throw "Tag $tag does not match package version $version" }
          $commit = git rev-parse HEAD
          Write-Host "Attaching Windows assets to release $tag"
          $raw = gh release view $tag --repo $repo --json isDraft,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw "Stage the draft release before pushing its tag." }
          $release = $raw | ConvertFrom-Json
          if (!$release.isDraft -or $release.targetCommitish -ne $commit) { throw "Refusing to modify a public or mismatched release." }
          # Only the top-level installer + portable zip — NOT nested files such as
          # win-unpacked/**/winpty-agent.exe. Recursing here previously uploaded a
          # duplicate-named nested .exe, which 404'd and aborted the whole upload
          # before Crew-Setup.exe was attached.
          $assets = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object { $_.FullName }
          Write-Host "Uploading assets:`n$($assets -join "`n")"
          # Upload one asset at a time and skip anything already stored intact.
          # A bulk --clobber deletes every asset first, so one transient 500 from
          # uploads.github.com discards the whole batch. Confirm each upload by
          # re-reading the release rather than trusting gh's exit status.
          $releaseId = gh api "repos/$repo/releases" --jq "map(select(.tag_name == ""$tag"" and .draft))[0].id"
          if (!$releaseId) { throw "Could not resolve the draft release id for $tag." }
          function Get-StoredAsset($name, $length) {
            $raw = gh api "repos/$repo/releases/$releaseId" --jq "(.assets // []) | map(select(.name == ""$name"" and .state == ""uploaded"" and .size == $length))[0].id"
            if ($LASTEXITCODE -ne 0) { return $null }
            return $raw
          }
          foreach ($asset in $assets) {
            $name = Split-Path $asset -Leaf
            $length = (Get-Item $asset).Length
            $attempt = 1
            while (!(Get-StoredAsset $name $length)) {
              if ($attempt -gt 5) { throw "$name is still not stored after 5 attempts." }
              Write-Host "Uploading $name (attempt $attempt)"
              gh release upload $tag $asset --repo $repo --clobber
              $attempt++
              if (!(Get-StoredAsset $name $length)) { Start-Sleep -Seconds 15 }
            }
            Write-Host "Stored $name"
          }
